<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Dosi impasti</title>
<style>
:root{
  --bg:#f4efe5;
  --card:#fffdf8;
  --ink:#2b2320;
  --ink-soft:#6f6156;
  --ink-faint:#9c8d7e;
  --line:#e4d9c7;
  --line-soft:#efe7da;
  --crust:#8a4620;
  --crust-soft:#f5e5d4;
  --acqua:#2d5a68;
  --acqua-soft:#e2edf0;
  --ok:#2f6b4f;
  --warn:#8a5a00;
  --warn-bg:#fdf1d8;
  --r:12px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#191512; --card:#221d19; --ink:#efe7dc; --ink-soft:#b3a493; --ink-faint:#8b7d6e;
    --line:#352d26; --line-soft:#2b241f; --crust:#d68a55; --crust-soft:#33251b;
    --acqua:#7fb5c4; --acqua-soft:#1d2a2f; --ok:#7bbb96; --warn:#e0b463; --warn-bg:#2c2418;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.45;
  -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--crust);outline-offset:2px}

/* ---------- elenco ---------- */
#vista-lista header{padding:22px 0 10px}
h1{font-family:var(--serif);font-weight:500;font-size:27px;margin:0 0 2px;letter-spacing:-.2px}
.sottotitolo{color:var(--ink-soft);font-size:14px;margin:0 0 16px}
.cerca{position:relative;margin-bottom:14px}
.cerca input{
  width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);outline:none;
}
.cerca input:focus{border-color:var(--crust)}
.gruppo-cat{font-family:var(--serif);font-size:14px;color:var(--ink-soft);margin:18px 0 7px;font-style:italic}
.riga-ric{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 14px;margin-bottom:7px;
}
.riga-ric:active{background:var(--crust-soft)}
.riga-ric .nome{font-family:var(--serif);font-size:17px;line-height:1.25}
.riga-ric .meta{font-size:12.5px;color:var(--ink-faint);margin-top:2px}
.riga-ric .crescita{flex:1;min-width:0;border:none;background:none;padding:0;text-align:left;font:inherit;color:inherit}
.stella{
  border:none;background:none;padding:6px;line-height:1;font-size:17px;
  color:var(--ink-faint);flex:none;
}
.stella.on{color:var(--crust)}
.vuoto{color:var(--ink-faint);text-align:center;padding:34px 0;font-size:14px}

/* ---------- dettaglio ---------- */
#vista-det{display:none}
.barra{
  position:sticky;top:0;z-index:10;background:var(--bg);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.barra-top{display:flex;align-items:center;gap:10px;padding:10px 0 8px}
.indietro{
  border:1px solid var(--line);background:var(--card);border-radius:9px;
  padding:6px 11px;font-size:14px;
}
.titolo-ric{font-family:var(--serif);font-size:19px;line-height:1.2;flex:1;min-width:0}
.titolo-ric small{display:block;font-family:var(--sans);font-size:12px;color:var(--ink-faint);font-weight:400}

.calcolo{padding-bottom:12px}
.segm{display:flex;gap:4px;background:var(--line-soft);border-radius:10px;padding:3px;margin-bottom:10px}
.segm button{
  flex:1;border:none;background:none;padding:8px 4px;border-radius:8px;
  font-size:13px;color:var(--ink-soft);
}
.segm button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.07)}
.campo{display:flex;align-items:center;gap:8px}
.campo input[type=number]{
  flex:1;min-width:0;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);font-size:26px;font-family:var(--serif);
  font-variant-numeric:tabular-nums;outline:none;-moz-appearance:textfield;
}
.campo input:focus{border-color:var(--crust)}
.campo input::-webkit-outer-spin-button,.campo input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.campo .um{color:var(--ink-faint);font-size:15px;flex:none}
.campo select{
  flex:1;min-width:0;padding:13px 8px;border:1px solid var(--line);border-radius:10px;background:var(--card);
}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{
  border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:6px 12px;font-size:13px;color:var(--ink-soft);
}
.chip:active{background:var(--crust-soft)}

/* ---------- metriche ---------- */
.metriche{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}
@media (min-width:520px){.metriche{grid-template-columns:repeat(4,1fr)}}
.metrica{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
.metrica .v{font-family:var(--serif);font-size:19px;font-variant-numeric:tabular-nums;line-height:1.15}
.metrica .l{font-size:11.5px;color:var(--ink-faint);margin-top:1px}
.metrica.idro .v{color:var(--acqua)}

/* ---------- tabella dosi ---------- */
.blocco{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.blocco h3{
  margin:0;padding:10px 14px;font-family:var(--serif);font-size:14.5px;font-weight:500;
  background:var(--line-soft);border-bottom:1px solid var(--line);color:var(--ink-soft);
}
.ing{display:flex;align-items:baseline;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line-soft)}
.ing:last-child{border-bottom:none}
.ing .n{flex:1;min-width:0}
.ing .n em{display:block;font-style:normal;font-size:12px;color:var(--ink-faint);line-height:1.3}
.ing .g{
  font-family:var(--serif);font-size:19px;font-variant-numeric:tabular-nums;
  white-space:nowrap;text-align:right;
}
.ing .g span{font-family:var(--sans);font-size:11.5px;color:var(--ink-faint);margin-left:3px}
.ing.farina{box-shadow:inset 3px 0 0 var(--crust)}
.ing.acqua{box-shadow:inset 3px 0 0 var(--acqua)}
.ing.opz .g{color:var(--ink-faint)}
.ing .ridotto{font-size:11.5px;color:var(--warn);white-space:nowrap}

/* ---------- testi ---------- */
.sez{margin:18px 0 8px;font-family:var(--serif);font-size:15px;color:var(--ink-soft);font-style:italic}
.passi{margin:0;padding:0;list-style:none}
.passi li{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:10px 13px;margin-bottom:6px;font-size:14.5px;line-height:1.5;
}
.passi li b{font-weight:600}
.tabellina{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13.5px}
.tabellina th,.tabellina td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line-soft)}
.tabellina th{background:var(--line-soft);font-weight:600;color:var(--ink-soft);font-size:12.5px}
.tabellina tr:last-child td{border-bottom:none}
.avviso{
  background:var(--warn-bg);border:1px solid rgba(138,90,0,.25);color:var(--warn);
  border-radius:10px;padding:10px 13px;font-size:13.5px;line-height:1.45;margin-bottom:8px;
}
.param{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line-soft)}
.param:last-child{border-bottom:none}
.param label{flex:1;font-size:14px}
.param label em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-faint)}
.param input{
  width:82px;padding:7px 9px;text-align:right;border:1px solid var(--line);
  border-radius:8px;background:var(--bg);font-variant-numeric:tabular-nums;outline:none;
}
.riga-sale{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--ink-soft);margin:2px 0 14px}
.riga-sale input{width:18px;height:18px;accent-color:var(--crust)}
.pieno{padding-bottom:40px}
footer.nota-file{color:var(--ink-faint);font-size:12px;padding:16px 0 30px;line-height:1.5}

@media print{
  .barra-top,.segm,.chips,.stella,.cerca,.riga-sale,footer.nota-file{display:none!important}
  body{background:#fff;font-size:12pt}
  .blocco,.metrica,.passi li{border-color:#bbb;break-inside:avoid}
}

/* ---------- etichette e editor ---------- */
.tag{font-size:10px;background:var(--crust-soft);color:var(--crust);border-radius:5px;padding:1px 5px;vertical-align:2px;font-family:var(--sans)}
.testa-lista{display:flex;align-items:flex-start;gap:10px}
.testa-lista h1{flex:1}
.btn-tondo{
  border:1px solid var(--line);background:var(--card);border-radius:10px;
  width:40px;height:40px;font-size:22px;line-height:1;color:var(--crust);flex:none;
}
.btn-primario{
  border:none;background:var(--crust);color:#fff;border-radius:9px;padding:8px 14px;
  font-size:14px;font-weight:600;flex:none;
}
#vista-ed{display:none}
.blocco h3{display:flex;align-items:center;gap:8px}
.blocco > summary{
  padding:10px 14px;font-family:var(--serif);font-size:14.5px;color:var(--ink-soft);cursor:pointer;
}
.ed-riga{display:flex;flex-wrap:wrap;gap:5px;padding:9px 12px;border-bottom:1px solid var(--line-soft)}
.ed-riga:last-child{border-bottom:none}
.ed-riga input,.ed-riga select{
  padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);
  outline:none;min-width:0;font-size:14px;
}
.ed-riga input:focus,.ed-riga select:focus,.param input:focus,textarea:focus{border-color:var(--crust)}
.ed-n{flex:1 1 45%}
.ed-g,.ed-v{flex:0 0 78px;text-align:right;font-variant-numeric:tabular-nums}
.ed-t{flex:1 1 40%}
.ed-su,.ed-p{flex:1 1 34%}
.ed-e{flex:1 1 42%}
.ed-x{flex:0 0 34px;border:1px solid var(--line);background:var(--bg);border-radius:8px;color:var(--ink-faint);font-size:17px}
.ed-flag{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);font-weight:400}
.ed-flag input{accent-color:var(--crust);width:17px;height:17px}
.ed-gnome{flex:1;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:var(--sans);font-size:14px}
.ed-azioni{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px}
.param input[type=text]{text-align:left}
textarea{
  width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);
  color:var(--ink);font-family:inherit;font-size:14px;line-height:1.45;outline:none;resize:vertical;
}
.ed-strumenti{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
</style>
</head>
<body>

<div id="vista-lista" class="wrap">
  <header>
    <div class="testa-lista">
      <h1>Dosi impasti</h1>
      <button class="btn-tondo" id="btn-nuova" aria-label="nuova ricetta">+</button>
    </div>
    <p class="sottotitolo">Metti la farina, escono le dosi.</p>
  </header>
  <div class="cerca"><input id="q" type="search" placeholder="Cerca una ricetta" autocomplete="off"></div>
  <div id="elenco"></div>
  <footer class="nota-file">Ricette prese da formule_dosi.xlsx. I pesi sono in grammi, i totali si ricalcolano dalla quantità che imposti.
    <div class="ed-strumenti">
      <button class="chip" id="btn-esporta">Esporta le mie ricette</button>
      <label class="chip" for="file-importa">Importa</label>
      <input type="file" id="file-importa" accept="application/json,.json" style="display:none">
    </div>
  </footer>
</div>

<div id="vista-det">
  <div class="barra">
    <div class="wrap">
      <div class="barra-top">
        <button class="indietro" id="btn-indietro">Ricette</button>
        <div class="titolo-ric" id="det-titolo"></div>
        <button class="indietro" id="btn-modifica">Modifica</button>
      </div>
      <div class="calcolo">
        <div class="segm" id="det-driver"></div>
        <div class="campo" id="det-campo"></div>
        <div class="chips" id="det-chips"></div>
      </div>
    </div>
  </div>
  <div class="wrap pieno" id="det-corpo"></div>
</div>

<div id="vista-ed">
  <div class="barra"><div class="wrap"><div class="barra-top">
    <button class="indietro" id="ed-annulla">Annulla</button>
    <div class="titolo-ric" id="ed-titolo"></div>
    <button class="btn-primario" id="ed-salva">Salva</button>
  </div></div></div>
  <div class="wrap pieno" id="ed-corpo"></div>
</div>

const CATEGORIE = ["Pizza","Focacce","Pane","Colazione e dolci"];
const CHIAVE = "impasti_v2";

// Le ricette di serie stanno nel sorgente. Le modifiche e le ricette nuove
// vivono in localStorage e si sovrappongono, non sostituiscono: aggiornando il
// file HTML quello che hai scritto resta.
const STORE = { pref:[], saleRidotto:false, perRic:{}, mod:{}, nuove:[] };
let storageOk = true;
let RICETTE = [];

function salva(){
  try{
    localStorage.setItem(CHIAVE, JSON.stringify(STORE));
    storageOk = true;
  }catch(e){ storageOk = false; }
}
function carica(){
  try{
    localStorage.setItem(CHIAVE+"_prova","1"); localStorage.removeItem(CHIAVE+"_prova");
  }catch(e){ storageOk = false; }
  try{
    const raw = localStorage.getItem(CHIAVE) || localStorage.getItem("impasti_v1");
    if (!raw) return;
    const d = JSON.parse(raw);
    // i default si fondono sul salvato, mai sostituzione secca
    if (Array.isArray(d.pref)) STORE.pref = d.pref;
    STORE.saleRidotto = !!d.saleRidotto;
    if (d.perRic && typeof d.perRic === "object") STORE.perRic = d.perRic;
    if (d.mod && typeof d.mod === "object") STORE.mod = d.mod;
    if (Array.isArray(d.nuove)) STORE.nuove = d.nuove;
  }catch(e){}
}
function ricostruisci(){
  RICETTE = DI_SERIE.map(r => STORE.mod[r.id] ? Object.assign({}, r, STORE.mod[r.id]) : r)
                    .concat(STORE.nuove);
}
const diSerie   = id => DI_SERIE.some(r => r.id === id);
const modificata = id => !!STORE.mod[id];

// farina totale della ricetta di riferimento: da qui nasce il fattore di scala
function baseDi(r){
  if (r.tipo === "pre") return 1000;
  let s = 0;
  (r.gruppi||[]).forEach(g => { if (!g.extra) g.r.forEach(x => { if (!x.opz && !x.alt) s += x.g*(x.f||0); }); });
  return s || 1;
}

// Tutto e' lineare nella farina totale F, quindi qualsiasi punto di partenza
// (farina, peso impasto, pezzi, preimpasto) si riconduce a un solo fattore.
function dosi(r, F){
  let gr;
  if (r.tipo === "pre"){
    const FP = F*r.pre.quota, Fa = F-FP;
    const aP = FP*r.pre.acqua, lP = FP*r.pre.lievito;
    const aI = F*r.idro - aP;
    const imp = [
      {n:r.pre.nome, g:FP+aP+lP, rip:1, e:"tutto"},
      {n:"Farina", g:Fa, f:1},
      {n:"Acqua", g:aI, w:1}
    ];
    if (r.lievImpasto) imp.push({n:"Lievito", g:Fa*r.lievImpasto, e:"sulla farina aggiunta"});
    (r.altri||[]).forEach(a => {
      const q = a.su === "A" ? (aP+aI) : a.su === "Fa" ? Fa : F;
      imp.push({n:a.n, g:q*a.v, sale:a.sale, w:a.w, e:a.e});
    });
    gr = [
      {t:r.pre.nome + (r.pre.e ? " \u00b7 " + r.pre.e : ""), r:[
        {n:"Farina", g:FP, f:1}, {n:"Acqua", g:aP, w:1}, {n:"Lievito", g:lP}
      ]},
      {t:"Impasto", r:imp}
    ];
  } else {
    const k = F/baseDi(r);
    gr = (r.gruppi||[]).map(g => ({ t:g.t, extra:g.extra, r:g.r.map(x => Object.assign({}, x, {g:x.g*k})) }));
  }
  if (STORE.saleRidotto){
    gr = gr.map(g => ({ t:g.t, extra:g.extra, r:g.r.map(x => x.sale ? Object.assign({}, x, {g:x.g*0.8, ridotto:1}) : x) }));
  }
  return gr;
}
function totali(gr){
  let peso=0, farina=0, acqua=0;
  gr.forEach(g => g.r.forEach(x => {
    if (x.rip || x.alt || x.opz || g.extra) return;
    peso += x.g; farina += x.g*(x.f||0); acqua += x.g*(x.w||0);
  }));
  return { peso, farina, acqua, idro: farina ? acqua/farina : 0 };
}
const fattorePeso = r => totali(dosi(r,1000)).peso/1000;

function farinaDaDriver(r){
  const s = statoRic(r), f = fattorePeso(r);
  if (s.driver === "farina")  return Math.max(0, s.vFarina);
  if (s.driver === "impasto") return Math.max(0, s.vImpasto/f);
  if (s.driver === "pre")     return Math.max(0, s.vPre/r.pre.quota);
  const res = r.resa[Math.min(s.iResa, r.resa.length-1)];
  const tot = Math.max(0, s.vPezzi)*res.g;
  return res.su === "farina" ? tot : tot/f;
}
function statoRic(r){
  const def = {
    driver:"farina",
    vFarina: Math.round(baseDi(r)),
    vImpasto: Math.round(r.resa && r.resa[0] ? r.resa[0].g : 1000),
    vPezzi:1, iResa:0, vPre:500
  };
  const s = Object.assign(def, STORE.perRic[r.id] || {});
  if (s.driver === "pezzi" && !(r.resa && r.resa.length)) s.driver = "farina";
  if (s.driver === "pre" && r.tipo !== "pre") s.driver = "farina";
  if (!(s.iResa >= 0) || !r.resa || s.iResa >= r.resa.length) s.iResa = 0;
  STORE.perRic[r.id] = s;
  return s;
}

/* ---------- formattazione ---------- */
const nf = (v,d) => v.toLocaleString("it-IT",{minimumFractionDigits:d, maximumFractionDigits:d});
function g(v){
  if (!isFinite(v)) return "0";
  const a = Math.abs(v);
  if (a >= 100) return nf(Math.round(v),0);
  if (a >= 1)   return nf(Math.round(v*10)/10,1);
  return nf(Math.round(v*100)/100,2);
}
// i pezzi si contano, non si pesano: niente decimali inutili
function gp(v){
  if (!isFinite(v)) return "0";
  return Math.abs(v-Math.round(v)) < 0.05 ? nf(Math.round(v),0) : nf(Math.round(v*10)/10,1);
}
const pc = v => nf(Math.round(v*10000)/100, (Math.abs(v*100 - Math.round(v*100)) < 0.005) ? 0 : 2);
// valore per un input type=number: sempre col punto, altrimenti il campo resta vuoto
const pcv = v => String(Math.round((v||0)*10000)/100);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = v => { const x = parseFloat(String(v).replace(",",".")); return isFinite(x) ? x : 0; };
const righe = t => String(t||"").split("\n").map(x => x.trim()).filter(Boolean);

function driversDi(r){

  if (r.resa && r.resa.length){
    const res = r.resa[Math.min(s.iResa, r.resa.length-1)];

    h += metrica(gp(n), Math.round(n) === 1 ? res.n.toLowerCase() : (res.p || res.n.toLowerCase()));

  h += '</div>';
  h += '<label class="riga-sale"><input type="checkbox" id="sale-rid"'+(STORE.saleRidotto?" checked":"")+'> Sale ridotto del 20%</label>';

      h += '<div class="ing'+cls+'"><div class="n">'+esc(x.n)+(x.e?'<em>'+esc(x.e)+'</em>':'')+'</div>'

      +  campoPct("Lievito del "+r.pre.nome.toLowerCase(), "sulla farina del preimpasto", "pre.lievito", r.pre.lievito)

    +  'Dosi calcolate su '+g(F)+' g di farina totale.'
    +  (modificata(r.id) ? ' <button class="chip" id="btn-ripristina">Ripristina l\'originale</button>' : '')+'</footer>';

const metrica = (v,l) => '<div class="metrica"><div class="v">'+v+'</div><div class="l">'+esc(l)+'</div></div>';
const campoPct = (l,e,k,v) => '<div class="param"><label for="k-'+k+'">'+esc(l)+(e?'<em>'+esc(e)+'</em>':'')+'</label>'
  + '<input id="k-'+k+'" data-pct="'+k+'" type="number" inputmode="decimal" step="0.1" value="'+pcv(v)+'"><span class="um">%</span></div>';

function aggancia(){
  const r = sel, s = statoRic(r);
  document.querySelectorAll("[data-drv]").forEach(b => b.onclick = () => { s.driver = b.dataset.drv; salva(); renderDettaglio(); });

  const inp = document.getElementById("in-val");
  if (inp) inp.oninput = () => {
    const v = num(inp.value);
    if (s.driver === "farina") s.vFarina = v;
    else if (s.driver === "impasto") s.vImpasto = v;
    else if (s.driver === "pre") s.vPre = v;
    else s.vPezzi = v;
    salva(); aggiornaSoloDosi();
  };
  const selr = document.getElementById("in-resa");
  if (selr) selr.onchange = () => { s.iResa = +selr.value; salva(); aggiornaSoloDosi(); };

  document.querySelectorAll("[data-chip]").forEach(b => b.onclick = () => {
    const p = b.dataset.chip.split(":");
    if (p[0] === "farina"){ s.driver = "farina"; s.vFarina = +p[1]; }
    else { s.driver = "pezzi"; s.iResa = +p[1]; s.vPezzi = +p[2]; }
    salva(); renderDettaglio();
  });

  const cb = document.getElementById("sale-rid");
  if (cb) cb.onchange = () => { STORE.saleRidotto = cb.checked; salva(); renderDettaglio(); };

  // le percentuali scrivono dentro la ricetta, non in uno stato parallelo
  document.querySelectorAll("[data-pct]").forEach(i => i.onchange = () => {
    const k = i.dataset.pct, v = num(i.value)/100;
    const copia = JSON.parse(JSON.stringify(r));
    if (k.indexOf("pre.") === 0) copia.pre[k.slice(4)] = v;
    else if (k.indexOf("altri.") === 0) copia.altri[+k.slice(6)].v = v;
    else copia[k] = v;
    scriviRicetta(copia);
    sel = RICETTE.find(x => x.id === r.id);
    renderDettaglio();
  });

  const rip = document.getElementById("btn-ripristina");
  if (rip) rip.onclick = () => {
    if (!confirm("Torno alla versione originale di questa ricetta?")) return;
    delete STORE.mod[r.id]; salva(); ricostruisci();
    sel = RICETTE.find(x => x.id === r.id); renderDettaglio();
  };
}

// ridisegna solo dosi e metriche: non tocca il campo attivo, cosi' la tastiera
// del telefono non si chiude a ogni cifra
function aggiornaSoloDosi(){
  const r = sel, s = statoRic(r), F = farinaDaDriver(r);
  const gr = dosi(r,F), t = totali(gr);
  const met = document.querySelectorAll("#det-corpo .metrica .v");
  let i = 0;
  if (met[i]) met[i++].innerHTML = g(t.peso)+' <span style="font-size:13px">g</span>';
  if (met[i]) met[i++].innerHTML = g(t.farina)+' <span style="font-size:13px">g</span>';
  if (!r.noIdro && met[i]) met[i++].textContent = g(t.idro*100)+"%";
  if (r.resa && r.resa.length && met[i]){
    const res = r.resa[Math.min(s.iResa, r.resa.length-1)];
    const n = res.su === "farina" ? t.farina/res.g : t.peso/res.g;
    met[i].textContent = gp(n);
    const et = met[i].parentNode.querySelector(".l");
    if (et) et.textContent = Math.round(n) === 1 ? res.n.toLowerCase() : (res.p || res.n.toLowerCase());
  }
  const blocchi = document.querySelectorAll("#det-corpo .blocco");
  gr.forEach((grp,bi) => {
    const b = blocchi[bi]; if (!b) return;
    const rr = b.querySelectorAll(".ing");
    grp.r.forEach((x,j) => {
      const cel = rr[j] && rr[j].querySelector(".g"); if (!cel) return;
      cel.innerHTML = x.u ? g(x.g)+' <span>g \u00b7 '+gp(x.g/x.pz)+' '+esc(x.u)+'</span>' : g(x.g)+' <span>g</span>';
    });
  });
  const foot = document.querySelector("#det-corpo footer");
  if (foot && !foot.querySelector("button")) foot.textContent = (r.foglio ? "Foglio di origine: "+r.foglio+". " : "")+"Dosi calcolate su "+g(F)+" g di farina totale.";
}

/* ---------- scrittura ---------- */
function scriviRicetta(ric){
  if (diSerie(ric.id)) STORE.mod[ric.id] = ric;
  else {
    const i = STORE.nuove.findIndex(x => x.id === ric.id);
    if (i < 0) STORE.nuove.push(ric); else STORE.nuove[i] = ric;
  }
  salva(); ricostruisci();
}

/* ---------- editor ---------- */
const TIPI_RIGA = [["","normale"],["f","farina"],["w","acqua o liquido"],["l","licoli o lievito madre"],["s","sale"],["o","facoltativo"],["a","alternativa"]];
function tipoRiga(x){
  if (x.opz) return "o";
  if (x.alt) return "a";
  if (x.sale) return "s";
  if (x.f >= 1) return "f";
  if (x.w >= 1 && !x.f) return "w";
  if (x.f && x.w) return "l";
  return "";
}
function applicaTipo(x, t){
  delete x.f; delete x.w; delete x.sale; delete x.opz; delete x.alt;
  if (t === "f") x.f = 1;
  else if (t === "w") x.w = 1;
  else if (t === "l"){ x.f = 0.5; x.w = 0.5; }
  else if (t === "s") x.sale = 1;
  else if (t === "o") x.opz = 1;
  else if (t === "a") x.alt = 1;
  return x;
}

    (b.gruppi||[]).forEach((grp,i) => {
      h += '<div class="blocco" data-gruppo="'+i+'"><h3>'
        +  '<input class="ed-gnome" value="'+esc(grp.t)+'" placeholder="nome del gruppo">'
        +  '<label class="ed-flag"><input type="checkbox" class="ed-gextra"'+(grp.extra?" checked":"")+'> fuori dall\'impasto</label></h3>'
        +  '<div class="ed-righe">'+grp.r.map(rigaIng).join("")+'</div>'
        +  '<div class="ed-azioni"><button class="chip" data-addr="'+i+'">Aggiungi ingrediente</button>'
        +  (b.gruppi.length > 1 ? '<button class="chip" data-delg="'+i+'">Togli il gruppo</button>' : '')+'</div></div>';
    });
    h += '<div class="ed-azioni"><button class="chip" id="add-gruppo">Aggiungi un gruppo (salamoia, farcia, sfogliatura)</button></div>';
  }

  h += '<div class="blocco"><h3>Rese</h3><div class="ed-righe" id="ed-rese">'
    +  (b.resa||[]).map(rigaResa).join("")+'</div>'
    +  '<div class="ed-azioni"><button class="chip" id="add-resa">Aggiungi una resa</button></div></div>';

  h += '<div class="blocco"><h3>Testi</h3>'
    +  campoArea("Procedimento", "proc", (b.proc||[]).join("\n"))
    +  campoArea("Cottura", "cottura", (b.cottura||[]).join("\n"))
    +  campoArea("Note", "note", (b.note||[]).join("\n"))
    +  '<div class="param"><span class="nota-file" style="padding:0">Una riga per punto.</span></div></div>';

  h += '<div class="ed-azioni">';
  if (!bozzaNuova){
    h += '<button class="chip" id="ed-duplica">Duplica</button>';
    if (!diSerie(bozza.id)) h += '<button class="chip" id="ed-elimina">Elimina</button>';
    if (modificata(bozza.id)) h += '<button class="chip" id="ed-ripristina">Ripristina l\'originale</button>';
  }
  h += '</div>';

  document.getElementById("ed-corpo").innerHTML = h;
  agganciaEditor();
}
const campoTesto = (l,k,v) => '<div class="param"><label>'+esc(l)+'</label><input data-k="'+k+'" type="text" value="'+esc(v)+'" style="width:58%;text-align:left"></div>';
const campoArea  = (l,k,v) => '<div class="param" style="display:block"><label style="display:block;margin-bottom:5px">'+esc(l)+'</label><textarea data-k="'+k+'" rows="4">'+esc(v)+'</textarea></div>';
const edPct = (l,e,k,v) => '<div class="param"><label>'+esc(l)+(e?'<em>'+esc(e)+'</em>':'')+'</label><input data-kp="'+k+'" type="number" inputmode="decimal" step="0.1" value="'+pcv(v)+'"><span class="um">%</span></div>';

function rigaIng(x){
  const t = tipoRiga(x), extra = {};
  ["u","pz","rip","f","w","sale","opz","alt"].forEach(k => { if (x[k] !== undefined) extra[k] = x[k]; });
  return '<div class="ed-riga" data-t0="'+t+'" data-extra="'+esc(JSON.stringify(extra))+'">'
    + '<input class="ed-n" type="text" value="'+esc(x.n)+'" placeholder="ingrediente">'
    + '<input class="ed-g" type="number" inputmode="decimal" step="0.1" value="'+(+(x.g||0).toFixed(2))+'">'
    + '<button class="ed-x" aria-label="togli">\u00d7</button>'
    + '<select class="ed-t">'+TIPI_RIGA.map(o => '<option value="'+o[0]+'"'+(o[0]===t?" selected":"")+'>'+o[1]+'</option>').join("")+'</select>'
    + '<input class="ed-e" type="text" value="'+esc(x.e||"")+'" placeholder="nota"></div>';
}
function rigaAltro(a){
  const basi = [["F","sulla farina totale"],["A","sull\'acqua totale"],["Fa","sulla farina aggiunta"]];
  return '<div class="ed-riga ed-altro">'
    + '<input class="ed-n" type="text" value="'+esc(a.n)+'" placeholder="ingrediente">'
    + '<input class="ed-v" type="number" inputmode="decimal" step="0.1" value="'+pcv(a.v)+'">'
    + '<button class="ed-x" aria-label="togli">\u00d7</button>'
    + '<select class="ed-su">'+basi.map(o => '<option value="'+o[0]+'"'+(o[0]===(a.su||"F")?" selected":"")+'>'+o[1]+'</option>').join("")+'</select>'
    + '<select class="ed-t"><option value=""'+(!a.sale&&!a.w?" selected":"")+'>normale</option>'
    + '<option value="s"'+(a.sale?" selected":"")+'>sale</option>'
    + '<option value="w"'+(a.w?" selected":"")+'>liquido</option></select>'
    + '<input class="ed-e" type="text" value="'+esc(a.e||"")+'" placeholder="nota"></div>';
}
function rigaResa(x){
  return '<div class="ed-riga ed-resa">'
    + '<input class="ed-n" type="text" value="'+esc(x.n)+'" placeholder="teglia, panetto, pagnotta">'
    + '<input class="ed-g" type="number" inputmode="decimal" step="1" value="'+(+(x.g||0).toFixed(1))+'">'
    + '<button class="ed-x" aria-label="togli">\u00d7</button>'
    + '<input class="ed-p" type="text" value="'+esc(x.p||"")+'" placeholder="plurale">'
    + '<label class="ed-flag"><input type="checkbox" class="ed-su"'+(x.su==="farina"?" checked":"")+'> il peso e\' farina</label></div>';
}

function agganciaEditor(){
  const corpo = document.getElementById("ed-corpo");
  corpo.addEventListener("click", e => {
    const x = e.target.closest(".ed-x");
    if (x){ e.preventDefault(); x.parentNode.remove(); return; }
    const ar = e.target.closest("[data-addr]");
    if (ar){ e.preventDefault(); corpo.querySelectorAll("[data-gruppo]")[+ar.dataset.addr].querySelector(".ed-righe")
      .insertAdjacentHTML("beforeend", rigaIng({n:"", g:0})); return; }
    const dg = e.target.closest("[data-delg]");
    if (dg){ e.preventDefault(); leggiEditor(); bozza.gruppi.splice(+dg.dataset.delg,1); renderEditor(); return; }
  });
  const add = (id, fn) => { const b = document.getElementById(id); if (b) b.onclick = ev => { ev.preventDefault(); fn(); }; };
  add("add-gruppo", () => { leggiEditor(); bozza.gruppi.push({t:"Altro", r:[{n:"", g:0}]}); renderEditor(); });
  add("add-resa",   () => document.getElementById("ed-rese").insertAdjacentHTML("beforeend", rigaResa({n:"", g:0})));
  add("add-altro",  () => document.getElementById("ed-altri").insertAdjacentHTML("beforeend", rigaAltro({n:"", v:0, su:"F"})));
  add("ed-duplica", () => {
    leggiEditor();
    const c = JSON.parse(JSON.stringify(bozza));
    c.id = "u"+Date.now(); c.nome = bozza.nome+" (copia)"; delete c.foglio;
    bozza = c; bozzaNuova = true; renderEditor();
  });
  add("ed-elimina", () => {
    if (!confirm("Elimino questa ricetta?")) return;
    STORE.nuove = STORE.nuove.filter(x => x.id !== bozza.id);
    delete STORE.perRic[bozza.id];
    STORE.pref = STORE.pref.filter(x => x !== bozza.id);
    salva(); ricostruisci(); renderLista(); mostra("lista");
  });
  add("ed-ripristina", () => {
    if (!confirm("Torno alla versione originale?")) return;
    delete STORE.mod[bozza.id]; salva(); ricostruisci(); apri(bozza.id);
  });
  const tp = document.getElementById("ed-tipo");
  if (tp) tp.onchange = () => { leggiEditor(); bozza.tipo = tp.value; renderEditor(); };
}

function leggiEditor(){
  const b = bozza, corpo = document.getElementById("ed-corpo");
  corpo.querySelectorAll("[data-k]").forEach(i => {
    const k = i.dataset.k, v = i.value;
    if (k === "proc" || k === "cottura" || k === "note") b[k] = righe(v);
    else if (k.indexOf("pre.") === 0){ b.pre = b.pre || {}; b.pre[k.slice(4)] = v; }
    else b[k] = v;
  });
  corpo.querySelectorAll("[data-kp]").forEach(i => {
    const k = i.dataset.kp, v = num(i.value)/100;
    if (k.indexOf("pre.") === 0){ b.pre = b.pre || {}; b.pre[k.slice(4)] = v; }
    else b[k] = v;
  });
  if (b.tipo === "pre"){
    b.altri = [].map.call(corpo.querySelectorAll("#ed-altri .ed-riga"), d => {
      const a = { n:d.querySelector(".ed-n").value.trim(), v:num(d.querySelector(".ed-v").value)/100, su:d.querySelector(".ed-su").value };
      const t = d.querySelector(".ed-t").value;
      if (t === "s") a.sale = 1; if (t === "w") a.w = 1;
      const e = d.querySelector(".ed-e").value.trim(); if (e) a.e = e;
      return a;
    }).filter(a => a.n);
    delete b.gruppi;
  } else {
    b.gruppi = [].map.call(corpo.querySelectorAll("[data-gruppo]"), d => ({
      t: d.querySelector(".ed-gnome").value.trim() || "Impasto",
      extra: d.querySelector(".ed-gextra").checked ? 1 : undefined,
      r: [].map.call(d.querySelectorAll(".ed-riga"), rd => {
        let x = {};
        try{ x = JSON.parse(rd.dataset.extra || "{}"); }catch(err){}
        x.n = rd.querySelector(".ed-n").value.trim();
        x.g = num(rd.querySelector(".ed-g").value);
        const e = rd.querySelector(".ed-e").value.trim(); if (e) x.e = e; else delete x.e;
        const t = rd.querySelector(".ed-t").value;
        return t === (rd.dataset.t0 || "") ? x : applicaTipo(x, t);
      }).filter(x => x.n)
    })).filter(grp => grp.r.length);
    delete b.pre; delete b.altri; delete b.idro; delete b.lievImpasto;
  }
  b.resa = [].map.call(corpo.querySelectorAll("#ed-rese .ed-riga"), d => {
    const x = { n:d.querySelector(".ed-n").value.trim(), g:num(d.querySelector(".ed-g").value) };
    const p = d.querySelector(".ed-p").value.trim(); if (p) x.p = p;
    if (d.querySelector(".ed-su").checked) x.su = "farina";
    return x;
  }).filter(x => x.n && x.g > 0);
}

document.getElementById("ed-annulla").addEventListener("click", () => {
  if (sel) { sel = RICETTE.find(r => r.id === sel.id); if (sel) { renderDettaglio(); return mostra("det"); } }
  renderLista(); mostra("lista");
});
document.getElementById("ed-salva").addEventListener("click", () => {
  leggiEditor();
  const b = bozza;
  if (!b.nome.trim()) return alert("Manca il nome.");
  if (b.tipo === "pre"){
    if (!(b.pre.quota > 0 && b.pre.quota < 1)) return alert("La farina nel preimpasto deve stare fra 0 e 100%.");
    if (!(b.idro > 0)) return alert("Manca l'idratazione.");
    if (b.idro < b.pre.quota*b.pre.acqua) return alert("L'acqua del preimpasto supera l'idratazione totale: l'acqua dell'impasto verrebbe negativa.");
  } else {
    if (baseDi(b) <= 0) return alert("Serve almeno un ingrediente segnato come farina, con un peso.");
  }
  scriviRicetta(b);
  apri(b.id);
});

/* ---------- esporta e importa ---------- */
function esporta(){
  const dati = JSON.stringify({ formato:"impasti", data:new Date().toISOString(), mod:STORE.mod, nuove:STORE.nuove }, null, 1);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([dati], {type:"application/json"}));
  a.download = "impasti_mie_ricette.json";
  document.body.appendChild(a); a.click(); a.remove();
}
function importa(testo){
  let d;
  try{ d = JSON.parse(testo); }catch(e){ return alert("Il file non e' leggibile."); }
  if (!d || (!d.mod && !d.nuove)) return alert("Questo file non contiene ricette esportate da qui.");
  Object.keys(d.mod || {}).forEach(k => STORE.mod[k] = d.mod[k]);
  (d.nuove || []).forEach(r => {
    const i = STORE.nuove.findIndex(x => x.id === r.id);
    if (i < 0) STORE.nuove.push(r); else STORE.nuove[i] = r;
  });
  salva(); ricostruisci(); renderLista(); mostra("lista");
  alert("Importate "+Object.keys(d.mod||{}).length+" modifiche e "+(d.nuove||[]).length+" ricette.");
}

carica();
ricostruisci();
renderLista();

</script>
