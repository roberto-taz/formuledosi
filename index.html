/* ---------- impasto pizza CalBal ---------- */
// Modello ricavato facendo girare CalBal (approccio base) su circa 300 casi.
// L'impasto esce dall'impastatrice a 24 gradi e va verso la temperatura
// dell'ambiente o del frigo con una costante di tempo che cresce con la massa.
// Allo staglio i panielli fanno un salto di temperatura che dipende da quanti
// sono, poi seguono l'ambiente in fretta. Il lievito segue la formula classica
// dei pizzaioli (ore alla 1,24, temperatura alla 2,5) usando la temperatura
// dell'impasto ora per ora. Su 12 casi mai visti: farina e staglio identici,
// lievito entro il 4,5%, di solito entro il 2%.
const CB = { a:11.02082382188892, c:2.1, p:-1.2361954706050848, q:-2.4995164328032193,
             tb:2.125, tbe:0.335, tp:0.425, tpe:0.575 };
// W consigliata: 160,6 + 2,13 per ora + 0,005 per ogni grado-ora (temperatura alla 2,2)
const CBW = { a:160.6066632176546, h:2.1311529663985214, s:0.004992001434937517, c:2.2, max:365 };
const CB_K = [[2,0.019],[3,0.031],[4,0.0625],[6,0.106],[8,0.15],[12,0.294],[16,0.425],[40,0.93],[100,1]];
const CB_B = [[2,2.9],[3,2.8],[4,2.7],[6,2.6],[8,2.45],[12,2.1],[16,1.7],[40,0.1],[100,0]];
const CB_LIEVITI = { 1:{l:"fresco", k:1, n:"Lievito di birra fresco"}, 2:{l:"secco attivo", k:0.439, n:"Lievito secco attivo"}, 3:{l:"istantaneo", k:1/3, n:"Lievito secco istantaneo"} };
const CB_FINE = 24;   // temperatura dell'impasto a fine impastamento, come CalBal
function cbInterp(pts, x){
  if (x <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) if (x <= pts[i][0]){ const a = pts[i-1], b = pts[i]; return a[1] + (b[1]-a[1])*(x-a[0])/(b[0]-a[0]); }
  return pts[pts.length-1][1];
}
const cbAppretto = Ta => Math.max(1, 7.5 - 0.375*(Ta - 20));

// simula la temperatura dell'impasto e somma T^c nel tempo per i due esponenti che servono
function cbSimula(c){
  const M = c.n*c.w/1000, taub = CB.tb*Math.pow(M, CB.tbe), taup = CB.tp*Math.pow(c.w/250, CB.tpe);
  const fineFrigo = c.f > 0 ? 1 + c.f : 1;
  const st = Math.max(fineFrigo, c.h - cbAppretto(c.Ta));
  const env = t => (c.f > 0 && t >= 1 && t < 1 + c.f) ? c.Tf : c.Ta;
  let T = CB_FINE, t = 0, S1 = 0, S2 = 0, staglio = false, Tst = null, Tesce = null;
  const dt = 0.05, pw = (x, e) => Math.pow(Math.max(x, 0.1), e);
  while (t < c.h - 1e-9){
    if (c.f > 0 && Tesce === null && t >= 1 + c.f - 1e-9) Tesce = T;
    if (!staglio && t >= st - 1e-9){ Tst = T; T = T + cbInterp(CB_K, c.n)*(c.Ta - T) + cbInterp(CB_B, c.n); staglio = true; }
    const Tn = T + (env(t) - T)*(1 - Math.exp(-dt/(staglio ? taup : taub)));
    S1 += dt*(pw(T, CB.c) + pw(Tn, CB.c))/2;
    S2 += dt*(pw(T, CBW.c) + pw(Tn, CBW.c))/2;
    T = Tn; t += dt;
  }
  return { S1, S2, st, Tst, Tesce };
}
const cbWmin = I => I < 65 ? 0 : I <= 80 ? 220 + 4*(I-65) : I <= 90 ? 280 + 6*(I-80) : 340;

function cbCalcola(c){
  const sim = cbSimula(c);
  const Te = Math.pow(sim.S1/c.h, 1/CB.c);
  let lkg = Math.exp(CB.a)*Math.pow(c.h, CB.p)*Math.pow(Te, CB.q);      // g di fresco per kg di farina a 65%, sale 50 g/L, olio 0
  lkg *= Math.pow(65/c.I, 1.02)*(1 + c.S/200)/1.25*(1 + c.G/300);
  lkg *= CB_LIEVITI[c.tipo].k;
  const imp = c.n*c.w;
  const r = c.I/100;
  const F = imp/(1 + r + r*(c.S + c.G)/1000 + lkg/1000);
  const A = F*r;
  return {
    sim, imp, F, A, sale:A*c.S/1000, olio:A*c.G/1000, lievito:F*lkg/1000, lkg,
    W:Math.min(CBW.max, Math.round(CBW.a + CBW.h*c.h + CBW.s*sim.S2)), Wmin:cbWmin(c.I),
    mozz:0.36*imp, pomod:0.504*imp, salePom:0.504*imp*0.01
  };
}

function cbCfg(r){
  const s = statoRic(r);
  if (!s.cb || typeof s.cb !== "object") s.cb = {};
  const def = { n:4, w:250, I:65, S:50, G:0, tipo:1, h:24, f:0, Ta:21, Tf:5,
    tCucina:21, tFarina:21, mix:"plan", ancora:"parto", quando:"", pNapol:250, pTeglia:660 };
  Object.keys(def).forEach(k => { if (s.cb[k] === undefined) s.cb[k] = def[k]; });
  if (!(s.cb.pNapol >= 50)) s.cb.pNapol = 250;
  if (!(s.cb.pTeglia >= 50)) s.cb.pTeglia = 660;
  if (!CB_LIEVITI[s.cb.tipo]) s.cb.tipo = 1;
  if (!ATTRITO[s.cb.mix]) s.cb.mix = "plan";
  return s.cb;
}
// limiti che CalBal stesso rifiuta o che rompono il modello
function cbNorm(c){
  const x = Object.assign({}, c);
  x.n = Math.max(1, Math.round(x.n)); x.w = Math.max(50, x.w);
  x.I = Math.min(100, Math.max(45, x.I)); x.S = Math.max(0, x.S); x.G = Math.max(0, x.G);
  x.h = Math.max(2, x.h); x.f = Math.min(Math.max(0, x.f), x.h - 1.5);
  return x;
}

function cbPassi(c, R, inizio){
  const t0 = inizio.getTime(), at = h => new Date(t0 + h*ORA), sim = R.sim, P = [];
  const tAcq = 3*CB_FINE - c.tFarina - c.tCucina - ATTRITO[c.mix].v;
  P.push({ d:at(0), tit:"Impasta", txt:"Acqua a <b>"+gradi(tAcq)+"</b>, impasto finito a "+CB_FINE+" gradi. "
    + (c.f > 0 ? "Un'ora di puntata fuori, coperto." : "Puntata in massa, coperto, a "+gradi(c.Ta)+".") });
  if (c.f > 0){
    P.push({ d:at(1), tit:"In frigo", txt:"In massa, a "+gradi(c.Tf)+"." });
    const fuori = 1 + c.f;
    if (sim.st - fuori > 0.01){
      P.push({ d:at(fuori), tit:"Fuori dal frigo", txt:"L'impasto è a circa "+gradi(sim.Tesce)+". Resta in massa a "+gradi(c.Ta)+"." });
      P.push({ d:at(sim.st), tit:"Staglio", txt:"Panielli da "+g(c.w)+" g, appretto a "+gradi(c.Ta)+"." });
    } else {
      P.push({ d:at(fuori), tit:"Fuori e staglio", txt:"Esce a circa "+gradi(sim.Tesce)+": staglio subito, panielli da "+g(c.w)+" g, appretto a "+gradi(c.Ta)+"." });
    }
  } else {
    P.push({ d:at(sim.st), tit:"Staglio", txt:"Panielli da "+g(c.w)+" g, appretto a "+gradi(c.Ta)+"." });
  }
  P.push({ d:at(c.h), tit:"In forno", txt:"Dopo "+durata(c.h - sim.st)+" di appretto." });
  return { P, tAcq };
}

function renderCalbal(r){
  const raw = cbCfg(r);
  document.getElementById("det-titolo").innerHTML = esc(r.nome)+"<small>"+esc(r.sub||"")+"</small>";
  const drv = document.getElementById("det-driver"); drv.style.display = "none"; drv.innerHTML = "";
  document.getElementById("det-campo").innerHTML =
    '<button class="passo" data-cbpasso="-1" aria-label="meno">−</button>'
    + '<input type="number" inputmode="numeric" min="1" step="1" id="cb-n" value="'+raw.n+'">'
    + '<button class="passo" data-cbpasso="1" aria-label="piu">+</button>';
  document.getElementById("det-sotto").innerHTML = '<span class="um">panielli da</span>'
    + '<input id="cb-w" class="cb-w" type="number" inputmode="decimal" min="50" step="10" value="'+raw.w+'"><span class="um">g</span>'
    + '<button class="fatto" id="btn-fatto" hidden>Fatto</button>';
  document.getElementById("det-chips").innerHTML =
    '<button class="chip" data-cbpreset="napol">Napoletana '+g(raw.pNapol)+' g</button>'
    + '<button class="chip" data-cbpreset="teglia">Teglia '+g(raw.pTeglia)+' g</button>';
  document.getElementById("det-corpo").innerHTML =
    '<div id="cb-out1"></div>'
    + '<div class="sez">Impostazioni</div><div class="blocco biga" id="cb-in"></div>'
    + '<div id="cb-out2"></div>';
  renderCbIn(r); renderCbOut(r);
  agganciaCbTesta(r);
}

function renderCbIn(r){
  const c = cbCfg(r), box = document.getElementById("cb-in"); if (!box) return;
  const num1 = (l,e,k,u,step) => '<div class="param"><label>'+esc(l)+(e?'<em>'+e+'</em>':'')+'</label>'
    + '<input data-cbk="'+k+'" type="number" inputmode="decimal" step="'+(step||1)+'" value="'+c[k]+'"><span class="um">'+u+'</span></div>';
  const sel1 = (l,k,opz) => '<div class="param"><label>'+esc(l)+'</label><select data-cbs="'+k+'">'
    + opz.map(o => '<option value="'+o[0]+'"'+(String(o[0]) === String(c[k]) ? " selected" : "")+'>'+esc(o[1])+'</option>').join("")+'</select></div>';
  let h = num1("Idratazione", "acqua sulla farina", "I", "%", 1)
    + num1("Sale", "grammi per litro d'acqua", "S", "g/L", 1)
    + num1("Olio", "grammi per litro d'acqua", "G", "g/L", 1)
    + sel1("Lievito", "tipo", Object.keys(CB_LIEVITI).map(k => [k, CB_LIEVITI[k].l]))
    + num1("Ore totali", "dall'impasto al forno", "h", "h", 1)
    + num1("Di cui in frigo", "0 se tutto fuori", "f", "h", 1)
    + num1("Ambiente", "dove lievita fuori dal frigo", "Ta", "°C", 0.5)
    + (c.f > 0 ? num1("Frigo", "", "Tf", "°C", 0.5) : "")
    + num1("Cucina", "dove impasti", "tCucina", "°C", 0.5)
    + num1("Farina", "temperatura del sacco", "tFarina", "°C", 0.5)
    + sel1("Impasti", "mix", Object.keys(ATTRITO).map(k => [k, ATTRITO[k].l]))
    + num1("Paniello Napoletana", "peso del bottone in alto", "pNapol", "g", 10)
    + num1("Paniello Teglia", "peso del bottone in alto", "pTeglia", "g", 10);
  h += '<div class="segm">'+[["parto","Da quando parto"],["forno","Da quando inforno"]].map(o =>
    '<button data-cbancora="'+o[0]+'" aria-pressed="'+(c.ancora === o[0])+'">'+o[1]+'</button>').join("")+'</div>';
  h += '<div class="param b-quando"><label>'+(c.ancora === "forno" ? "Inforno" : "Impasto")
    + (c.ancora === "parto" ? '<em>vuoto vuol dire adesso</em>' : '')+'</label>'
    + '<input type="datetime-local" data-cbq value="'+esc(c.quando)+'">'
    + (c.ancora === "parto" ? '<button class="chip" data-cbadesso>adesso</button>' : '')+'</div>';
  box.innerHTML = h;
}

function renderCbOut(r){
  const raw = cbCfg(r), c = cbNorm(raw);
  const o1 = document.getElementById("cb-out1"), o2 = document.getElementById("cb-out2"); if (!o1) return;
  const R = cbCalcola(c);
  const q = cbNorm(raw);
  let inizio;
  const dq = daLocale(c.quando);
  if (c.ancora === "forno" && dq) inizio = new Date(dq.getTime() - c.h*ORA);
  else if (c.ancora === "parto" && dq) inizio = dq;
  else inizio = adessoArrotondato();
  const { P, tAcq } = cbPassi(c, R, inizio);
  const u = ' <span style="font-size:13px">g</span>';
  const lv = CB_LIEVITI[c.tipo];

  let h = '<div class="metriche">'
    + metrica(g(R.imp)+u, "peso impasto")
    + metrica(g(R.F)+u, "farina")
    + metrica(g(R.lievito)+u, "lievito "+lv.l)
    + metrica(String(R.W), "W consigliata") + '</div>';

  h += '<div class="blocco"><h3>Impasto</h3>'
    + cbRiga("Farina", R.F, "farina", "")
    + cbRiga("Acqua", R.A, "acqua", "a "+gradi(tAcq)+", per un impasto finito a "+CB_FINE)
    + cbRiga("Sale", R.sale, "", nf(Math.round(R.sale/R.F*1000)/10,1)+"% sulla farina")
    + (c.G > 0 ? cbRiga("Olio", R.olio, "", nf(Math.round(R.olio/R.F*1000)/10,1)+"% sulla farina") : "")
    + cbRiga(lv.n, R.lievito, "", nf(Math.round(R.lievito/R.F*100000)/1000,3)+"% sulla farina")
    + '</div>';
  if (R.lievito < 1){
    const sol = R.lievito*21;
    h += '<div class="avviso">Meno di un grammo non si pesa con una bilancia da cucina. Sciogli 1 g di lievito in 20 g d\'acqua presa dalla dose e usa <b>'+g(sol)+' g</b> di questa soluzione.</div>';
  }
  h += '<div class="blocco"><h3>Condimenti</h3>'
    + cbRiga("Mozzarella", R.mozz, "", g(R.mozz/c.n)+" g a paniello")
    + cbRiga("Pomodoro scolato", R.pomod, "", g(R.pomod/c.n)+" g a paniello")
    + cbRiga("Sale nel pomodoro", R.salePom, "", "1% del pomodoro")
    + '</div>';
  o1.innerHTML = h;

  const ora = Date.now();
  let k = '<div class="sez">Scaletta</div><div class="blocco biga">'
    + '<div class="bm">'+tile(quandoTxt(P[0].d), "impasto")+tile(quandoTxt(new Date(inizio.getTime()+R.sim.st*ORA)), "staglio")+tile(quandoTxt(P[P.length-1].d), "forno")+'</div>'
    + '<ol class="biga-passi">'+P.map(x => '<li'+(x.d.getTime() < ora - 60e3 ? ' class="passato"' : '')+'><span class="q">'+quandoTxt(x.d)+'</span><span><b>'+esc(x.tit)+'.</b> '+x.txt+'</span></li>').join("")+'</ol>'
    + '<div class="ed-azioni"><button class="chip" data-cbics>Promemoria nel calendario</button></div></div>';

  const av = [];
  if (raw.f !== q.f) av.push("Le ore di frigo devono lasciare almeno un'ora e mezza fuori: le ho portate a "+gradi(q.f).replace(" gradi","")+".");
  if (raw.h !== q.h) av.push("Sotto le 2 ore il modello non regge: le ho portate a 2.");
  if (R.Wmin && R.W < R.Wmin) av.push("Per maturare basterebbe W "+R.W+", ma con idratazione "+c.I+"% serve almeno W "+R.Wmin+" per assorbirla. Usa una farina da W "+R.Wmin+" o più, oppure riduci l'acqua o allunga i tempi.");
  if (R.W >= CBW.max) av.push("W "+CBW.max+" è il massimo di CalBal: con tempi così lunghi serve la farina più forte che trovi, tipo manitoba.");
  if (tAcq < 4) av.push("L'acqua dovrebbe stare a "+gradi(tAcq)+": raffredda anche la farina in frigo, oppure usa ghiaccio pesato dentro la dose.");
  if (c.ancora === "forno" && inizio.getTime() < ora - 5*60e3) av.push("Per infornare a quell'ora l'impasto andava fatto "+quandoTxt(inizio)+".");
  k += '<div class="sez">Farina</div><div class="blocco">'
    + '<div class="ing"><div class="n">W consigliata<em>per la maturazione in '+durata(c.h)+'</em></div><div class="g">'+R.W+'</div></div>'
    + '<div class="ing"><div class="n">W minima<em>per reggere idratazione '+c.I+'%</em></div><div class="g">'+(R.Wmin || "nessuna")+'</div></div></div>';
  if (av.length) k += av.map(x => '<div class="avviso">'+esc(x)+'</div>').join("");
  k += '<div class="sez">Note</div>'
    + '<div class="avviso">Il conto riproduce l\'approccio base di CalBal: stessi tempi di staglio, stessa farina, lievito entro qualche punto percentuale. Vale se l\'impasto esce dall\'impastatrice a '+CB_FINE+' gradi: più caldo vuol dire meno lievito, più freddo il contrario.</div>'
    + '<footer class="nota-file">Modello ricavato da circa 300 calcoli fatti su calbal.altervista.org.</footer>';
  o2.innerHTML = k;
}
function cbRiga(n, v, cls, e){
  return '<div class="ing'+(cls ? " "+cls : "")+'"><div class="n">'+esc(n)+(e ? '<em>'+esc(e)+'</em>' : '')+'</div><div class="g">'+g(v)+' <span>g</span></div></div>';
}

function agganciaCbTesta(r){
  const c = cbCfg(r), n = document.getElementById("cb-n"), w = document.getElementById("cb-w"), fatto = document.getElementById("btn-fatto");
  [n, w].forEach(x => {
    x.onfocus = () => { fatto.hidden = false; setTimeout(() => x.select(), 0); };
    x.onblur = () => { fatto.hidden = true; };
  });
  n.oninput = () => { const v = num(n.value); if (v >= 1){ c.n = Math.round(v); salva(); renderCbOut(r); } };
  w.oninput = () => { const v = num(w.value); if (v >= 50){ c.w = v; salva(); renderCbOut(r); } };
  fatto.onclick = () => { if (document.activeElement) document.activeElement.blur(); renderCalbal(r); };
  document.querySelectorAll("[data-cbpasso]").forEach(b => b.onclick = () => {
    c.n = Math.max(1, Math.round(c.n) + +b.dataset.cbpasso); n.value = c.n; salva(); renderCbOut(r);
  });
  document.querySelectorAll("[data-cbpreset]").forEach(b => b.onclick = () => {
    Object.assign(c, b.dataset.cbpreset === "teglia" ? {w:c.pTeglia, I:80, S:30, G:20} : {w:c.pNapol, I:65, S:50, G:0});
    salva(); renderCalbal(r);
  });
}
// campi e bottoni nel corpo: un ascoltatore solo, come per la biga
corpoDet.addEventListener("change", e => {
  const r = sel, t = e.target; if (!r || !r.calbal || !t.closest("#cb-in")) return;
  const c = cbCfg(r);
  if (t.dataset.cbk){
    const prima = c.f;
    c[t.dataset.cbk] = num(t.value);
    if (t.dataset.cbk === "pNapol" || t.dataset.cbk === "pTeglia"){
      if (!(c[t.dataset.cbk] >= 50)) c[t.dataset.cbk] = t.dataset.cbk === "pNapol" ? 250 : 660;
      salva();
      // solo la scritta: ridisegnare i bottoni farebbe perdere il tocco che arriva subito dopo
      const bn = document.querySelector('[data-cbpreset="napol"]'), bt = document.querySelector('[data-cbpreset="teglia"]');
      if (bn) bn.textContent = "Napoletana "+g(c.pNapol)+" g";
      if (bt) bt.textContent = "Teglia "+g(c.pTeglia)+" g";
      return;
    }
    salva(); renderCbOut(r);
    if ((prima > 0) !== (c.f > 0)) renderCbIn(r);
  }
  else if (t.dataset.cbs){ c[t.dataset.cbs] = t.dataset.cbs === "tipo" ? +t.value : t.value; salva(); renderCbOut(r); }
  else if (t.hasAttribute("data-cbq")){ c.quando = t.value; salva(); renderCbOut(r); }
});
corpoDet.addEventListener("click", e => {
  const r = sel; if (!r || !r.calbal) return;
  const b = e.target.closest("[data-cbancora],[data-cbadesso],[data-cbics]"); if (!b) return;
  e.preventDefault();
  const c = cbCfg(r);
  if (b.dataset.cbancora){
    c.ancora = b.dataset.cbancora;
    if (c.ancora === "forno"){
      const q = daLocale(c.quando);
      if (!q || q.getTime() < Date.now()){ const d = new Date(); d.setDate(d.getDate()+1); d.setHours(20,0,0,0); c.quando = aLocale(d); }
    } else c.quando = "";
    salva(); renderCbIn(r); renderCbOut(r); return;
  }
  if (b.hasAttribute("data-cbadesso")){ c.quando = ""; salva(); renderCbIn(r); renderCbOut(r); return; }
  if (b.hasAttribute("data-cbics")){
    const q = cbNorm(c), R = cbCalcola(q), dq = daLocale(q.quando);
    const inizio = q.ancora === "forno" && dq ? new Date(dq.getTime() - q.h*ORA) : q.ancora === "parto" && dq ? dq : adessoArrotondato();
    const P = cbPassi(q, R, inizio).P.filter(x => x.d.getTime() > Date.now() - 60e3);
    icsDaPassi(r.nome, P, inizio.getTime(), "pizza");
  }
});

/* ---------- editor ---------- */
const TIPI_RIGA = [["","normale"],["f","farina"],["w","acqua o liquido"],["l","licoli o lievito madre"],["s","sale"],["o","facoltativo"],["a","alternativa"]];
function tipoRiga(x){
  if (x.opz) return "o";
  if (x.alt) return "a";
  if (x.sale) return "s";
  if (x.f >= 1) return "f";
  if (x.w >= 1 && !x.f) return "w";
  if (x.f && x.w) return "l";
  return "";
}
function applicaTipo(x, t){
  delete x.f; delete x.w; delete x.sale; delete x.opz; delete x.alt;
  if (t === "f") x.f = 1;
  else if (t === "w") x.w = 1;
  else if (t === "l"){ x.f = 0.5; x.w = 0.5; }
  else if (t === "s") x.sale = 1;
  else if (t === "o") x.opz = 1;
  else if (t === "a") x.alt = 1;
  return x;
}

function apriEditor(id){
  bozzaNuova = !id;
  if (id){
    bozza = JSON.parse(JSON.stringify(RICETTE.find(r => r.id === id)));
  } else {
    bozza = { id:"u"+Date.now(), nome:"", sub:"", cat:"Pane", tipo:"diretta",
      gruppi:[{t:"Impasto", r:[{n:"Farina", g:1000, f:1},{n:"Acqua", g:650, w:1},{n:"Sale", g:20, sale:1},{n:"Lievito", g:5}]}],
      resa:[], proc:[], cottura:[], note:[] };
  }
  mostra("ed"); renderEditor();
}
function renderEditor(){
  const b = bozza;
  document.getElementById("ed-titolo").innerHTML = (bozzaNuova ? "Nuova ricetta" : "Modifica")+"<small>"+esc(b.nome||"")+"</small>";
  let h = "";

  h += '<div class="blocco"><h3>Scheda</h3>'
    +  campoTesto("Nome", "nome", b.nome)
    +  campoTesto("Sottotitolo", "sub", b.sub)
    +  '<div class="param"><label>Categoria</label><select data-k="cat" style="width:auto;flex:0 0 auto">'
    +  CATEGORIE.map(c => '<option'+(c===b.cat?" selected":"")+'>'+esc(c)+'</option>').join("")+'</select></div>';
  if (bozzaNuova){
    h += '<div class="param"><label>Struttura<em>la scegli solo adesso, dopo non si cambia</em></label>'
      +  '<select data-k="tipo" id="ed-tipo" style="width:auto;flex:0 0 auto">'
      +  '<option value="diretta"'+(b.tipo==="diretta"?" selected":"")+'>dosi in grammi</option>'
      +  '<option value="pre"'+(b.tipo==="pre"?" selected":"")+'>con biga o poolish</option></select></div>';
  }
  h += '</div>';

  if (b.tipo === "pre"){
    b.pre = b.pre || {nome:"Biga", quota:0.8, acqua:0.45, lievito:0.01, e:""};
    h += '<div class="blocco"><h3>Preimpasto</h3>'
      +  campoTesto("Come si chiama", "pre.nome", b.pre.nome)
      +  campoTesto("Nota (tempi e gradi)", "pre.e", b.pre.e)
      +  edPct("Farina nel preimpasto", "sulla farina totale", "pre.quota", b.pre.quota)
      +  edPct("Acqua", "sulla farina del preimpasto", "pre.acqua", b.pre.acqua)
      +  edPct("Lievito", "sulla farina del preimpasto", "pre.lievito", b.pre.lievito)
      +  '</div>';
    if (!b.soloBiga) h += '<div class="blocco"><h3>Impasto</h3>'
      +  edPct("Idratazione", "sulla farina totale, acqua del preimpasto compresa", "idro", b.idro||0.65)
      +  edPct("Lievito", "sulla farina aggiunta", "lievImpasto", b.lievImpasto||0)
      +  '<div class="ed-righe" id="ed-altri">'+(b.altri||[]).map(rigaAltro).join("")+'</div>'
      +  '<div class="ed-azioni"><button class="chip" id="add-altro">Aggiungi ingrediente</button></div></div>';
  } else {
    (b.gruppi||[]).forEach((grp,i) => {
      h += '<div class="blocco" data-gruppo="'+i+'"><h3>'
        +  '<input class="ed-gnome" value="'+esc(grp.t)+'" placeholder="nome del gruppo">'
        +  '<label class="ed-flag"><input type="checkbox" class="ed-gextra"'+(grp.extra?" checked":"")+'> fuori dall\'impasto</label></h3>'
        +  '<div class="ed-righe">'+grp.r.map(rigaIng).join("")+'</div>'
        +  '<div class="ed-azioni"><button class="chip" data-addr="'+i+'">Aggiungi ingrediente</button>'
        +  (b.gruppi.length > 1 ? '<button class="chip" data-delg="'+i+'">Togli il gruppo</button>' : '')+'</div></div>';
    });
    h += '<div class="ed-azioni"><button class="chip" id="add-gruppo">Aggiungi un gruppo (salamoia, farcia, sfogliatura)</button></div>';
  }

  h += '<div class="blocco"><h3>Rese</h3><div class="ed-righe" id="ed-rese">'
    +  (b.resa||[]).map(rigaResa).join("")+'</div>'
    +  '<div class="ed-azioni"><button class="chip" id="add-resa">Aggiungi una resa</button></div></div>';

  h += '<div class="blocco"><h3>Testi</h3>'
    +  campoArea("Procedimento", "proc", (b.proc||[]).join("\n"))
    +  campoArea("Cottura", "cottura", (b.cottura||[]).join("\n"))
    +  campoArea("Note", "note", (b.note||[]).join("\n"))
    +  '<div class="param"><span class="nota-file" style="padding:0">Una riga per punto.</span></div></div>';

  h += '<div class="ed-azioni">';
  if (!bozzaNuova){
    h += '<button class="chip" id="ed-duplica">Duplica</button>';
    if (!diSerie(bozza.id)) h += '<button class="chip" id="ed-elimina">Elimina</button>';
    if (modificata(bozza.id)) h += '<button class="chip" id="ed-ripristina">Ripristina l\'originale</button>';
  }
  h += '</div>';

  document.getElementById("ed-corpo").innerHTML = h;
  agganciaEditor();
}
const campoTesto = (l,k,v) => '<div class="param"><label>'+esc(l)+'</label><input data-k="'+k+'" type="text" value="'+esc(v)+'" style="width:58%;text-align:left"></div>';
const campoArea  = (l,k,v) => '<div class="param" style="display:block"><label style="display:block;margin-bottom:5px">'+esc(l)+'</label><textarea data-k="'+k+'" rows="4">'+esc(v)+'</textarea></div>';
const edPct = (l,e,k,v) => '<div class="param"><label>'+esc(l)+(e?'<em>'+esc(e)+'</em>':'')+'</label><input data-kp="'+k+'" type="number" inputmode="decimal" step="0.1" value="'+pcv(v)+'"><span class="um">%</span></div>';

function rigaIng(x){
  const t = tipoRiga(x), extra = {};
  ["u","pz","rip","f","w","sale","opz","alt"].forEach(k => { if (x[k] !== undefined) extra[k] = x[k]; });
  return '<div class="ed-riga" data-t0="'+t+'" data-extra="'+esc(JSON.stringify(extra))+'">'
    + '<input class="ed-n" type="text" value="'+esc(x.n)+'" placeholder="ingrediente">'
    + '<input class="ed-g" type="number" inputmode="decimal" step="0.1" value="'+(+(x.g||0).toFixed(2))+'">'
    + '<button class="ed-x" aria-label="togli">\u00d7</button>'
    + '<select class="ed-t">'+TIPI_RIGA.map(o => '<option value="'+o[0]+'"'+(o[0]===t?" selected":"")+'>'+o[1]+'</option>').join("")+'</select>'
    + '<input class="ed-e" type="text" value="'+esc(x.e||"")+'" placeholder="nota"></div>';
}
function rigaAltro(a){
  const basi = [["F","sulla farina totale"],["A","sull\'acqua totale"],["Fa","sulla farina aggiunta"]];
  return '<div class="ed-riga ed-altro">'
    + '<input class="ed-n" type="text" value="'+esc(a.n)+'" placeholder="ingrediente">'
    + '<input class="ed-v" type="number" inputmode="decimal" step="0.1" value="'+pcv(a.v)+'">'
    + '<button class="ed-x" aria-label="togli">\u00d7</button>'
    + '<select class="ed-su">'+basi.map(o => '<option value="'+o[0]+'"'+(o[0]===(a.su||"F")?" selected":"")+'>'+o[1]+'</option>').join("")+'</select>'
    + '<select class="ed-t"><option value=""'+(!a.sale&&!a.w?" selected":"")+'>normale</option>'
    + '<option value="s"'+(a.sale?" selected":"")+'>sale</option>'
    + '<option value="w"'+(a.w?" selected":"")+'>liquido</option></select>'
    + '<input class="ed-e" type="text" value="'+esc(a.e||"")+'" placeholder="nota"></div>';
}
function rigaResa(x){
  return '<div class="ed-riga ed-resa">'
    + '<input class="ed-n" type="text" value="'+esc(x.n)+'" placeholder="teglia, panetto, pagnotta">'
    + '<input class="ed-g" type="number" inputmode="decimal" step="1" value="'+(+(x.g||0).toFixed(1))+'">'
    + '<button class="ed-x" aria-label="togli">\u00d7</button>'
    + '<input class="ed-p" type="text" value="'+esc(x.p||"")+'" placeholder="plurale">'
    + '<label class="ed-flag"><input type="checkbox" class="ed-su"'+(x.su==="farina"?" checked":"")+'> il peso e\' farina</label></div>';
}

function agganciaEditor(){
  const corpo = document.getElementById("ed-corpo");
  corpo.addEventListener("click", e => {
    const x = e.target.closest(".ed-x");
    if (x){ e.preventDefault(); x.parentNode.remove(); return; }
    const ar = e.target.closest("[data-addr]");
    if (ar){ e.preventDefault(); corpo.querySelectorAll("[data-gruppo]")[+ar.dataset.addr].querySelector(".ed-righe")
      .insertAdjacentHTML("beforeend", rigaIng({n:"", g:0})); return; }
    const dg = e.target.closest("[data-delg]");
    if (dg){ e.preventDefault(); leggiEditor(); bozza.gruppi.splice(+dg.dataset.delg,1); renderEditor(); return; }
  });
  const add = (id, fn) => { const b = document.getElementById(id); if (b) b.onclick = ev => { ev.preventDefault(); fn(); }; };
  add("add-gruppo", () => { leggiEditor(); bozza.gruppi.push({t:"Altro", r:[{n:"", g:0}]}); renderEditor(); });
  add("add-resa",   () => document.getElementById("ed-rese").insertAdjacentHTML("beforeend", rigaResa({n:"", g:0})));
  add("add-altro",  () => document.getElementById("ed-altri").insertAdjacentHTML("beforeend", rigaAltro({n:"", v:0, su:"F"})));
  add("ed-duplica", () => {
    leggiEditor();
    const c = JSON.parse(JSON.stringify(bozza));
    c.id = "u"+Date.now(); c.nome = bozza.nome+" (copia)"; delete c.foglio;
    bozza = c; bozzaNuova = true; renderEditor();
  });
  add("ed-elimina", () => {
    if (!confirm("Elimino questa ricetta?")) return;
    STORE.nuove = STORE.nuove.filter(x => x.id !== bozza.id);
    delete STORE.perRic[bozza.id];
    STORE.pref = STORE.pref.filter(x => x !== bozza.id);
    salva(); ricostruisci(); renderLista(); mostra("lista");
  });
  add("ed-ripristina", () => {
    if (!confirm("Torno alla versione originale?")) return;
    delete STORE.mod[bozza.id]; salva(); ricostruisci(); apri(bozza.id);
  });
  const tp = document.getElementById("ed-tipo");
  if (tp) tp.onchange = () => { leggiEditor(); bozza.tipo = tp.value; renderEditor(); };
}

function leggiEditor(){
  const b = bozza, corpo = document.getElementById("ed-corpo");
  corpo.querySelectorAll("[data-k]").forEach(i => {
    const k = i.dataset.k, v = i.value;
    if (k === "proc" || k === "cottura" || k === "note") b[k] = righe(v);
    else if (k.indexOf("pre.") === 0){ b.pre = b.pre || {}; b.pre[k.slice(4)] = v; }
    else b[k] = v;
  });
  corpo.querySelectorAll("[data-kp]").forEach(i => {
    const k = i.dataset.kp, v = num(i.value)/100;
    if (k.indexOf("pre.") === 0){ b.pre = b.pre || {}; b.pre[k.slice(4)] = v; }
    else b[k] = v;
  });
  if (b.tipo === "pre"){
    b.altri = [].map.call(corpo.querySelectorAll("#ed-altri .ed-riga"), d => {
      const a = { n:d.querySelector(".ed-n").value.trim(), v:num(d.querySelector(".ed-v").value)/100, su:d.querySelector(".ed-su").value };
      const t = d.querySelector(".ed-t").value;
      if (t === "s") a.sale = 1; if (t === "w") a.w = 1;
      const e = d.querySelector(".ed-e").value.trim(); if (e) a.e = e;
      return a;
    }).filter(a => a.n);
    delete b.gruppi;
  } else {
    b.gruppi = [].map.call(corpo.querySelectorAll("[data-gruppo]"), d => ({
      t: d.querySelector(".ed-gnome").value.trim() || "Impasto",
      extra: d.querySelector(".ed-gextra").checked ? 1 : undefined,
      r: [].map.call(d.querySelectorAll(".ed-riga"), rd => {
        let x = {};
        try{ x = JSON.parse(rd.dataset.extra || "{}"); }catch(err){}
        x.n = rd.querySelector(".ed-n").value.trim();
        x.g = num(rd.querySelector(".ed-g").value);
        const e = rd.querySelector(".ed-e").value.trim(); if (e) x.e = e; else delete x.e;
        const t = rd.querySelector(".ed-t").value;
        return t === (rd.dataset.t0 || "") ? x : applicaTipo(x, t);
      }).filter(x => x.n)
    })).filter(grp => grp.r.length);
    delete b.pre; delete b.altri; delete b.idro; delete b.lievImpasto;
  }
  b.resa = [].map.call(corpo.querySelectorAll("#ed-rese .ed-riga"), d => {
    const x = { n:d.querySelector(".ed-n").value.trim(), g:num(d.querySelector(".ed-g").value) };
    const p = d.querySelector(".ed-p").value.trim(); if (p) x.p = p;
    if (d.querySelector(".ed-su").checked) x.su = "farina";
    return x;
  }).filter(x => x.n && x.g > 0);
}

document.getElementById("ed-annulla").addEventListener("click", () => {
  if (sel) { sel = RICETTE.find(r => r.id === sel.id); if (sel) { renderDettaglio(); return mostra("det"); } }
  renderLista(); mostra("lista");
});
document.getElementById("ed-salva").addEventListener("click", () => {
  leggiEditor();
  const b = bozza;
  if (!b.nome.trim()) return alert("Manca il nome.");
  if (b.tipo === "pre"){
    if (!(b.pre.quota > 0 && (b.pre.quota < 1 || (b.soloBiga && b.pre.quota <= 1)))) return alert("La farina nel preimpasto deve stare fra 0 e 100%.");
    if (!(b.idro > 0)) return alert("Manca l'idratazione.");
    if (b.idro < b.pre.quota*b.pre.acqua) return alert("L'acqua del preimpasto supera l'idratazione totale: l'acqua dell'impasto verrebbe negativa.");
  } else {
    if (baseDi(b) <= 0) return alert("Serve almeno un ingrediente segnato come farina, con un peso.");
  }
  scriviRicetta(b);
  apri(b.id);
});

/* ---------- esporta e importa ---------- */
function esporta(){
  const dati = JSON.stringify({ formato:"impasti", data:new Date().toISOString(), mod:STORE.mod, nuove:STORE.nuove, diario:STORE.diario }, null, 1);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([dati], {type:"application/json"}));
  a.download = "impasti_mie_ricette.json";
  document.body.appendChild(a); a.click(); a.remove();
}
function importa(testo){
  let d;
  try{ d = JSON.parse(testo); }catch(e){ return alert("Il file non e' leggibile."); }
  if (!d || (!d.mod && !d.nuove && !d.diario)) return alert("Questo file non contiene ricette esportate da qui.");
  Object.keys(d.mod || {}).forEach(k => STORE.mod[k] = d.mod[k]);
  (d.nuove || []).forEach(r => {
    const i = STORE.nuove.findIndex(x => x.id === r.id);
    if (i < 0) STORE.nuove.push(r); else STORE.nuove[i] = r;
  });
  (d.diario || []).forEach(x => { if (x && x.id && !STORE.diario.some(y => y.id === x.id)) STORE.diario.push(x); });
  STORE.diario.sort((a,b) => String(a.inizio).localeCompare(String(b.inizio)));
  salva(); ricostruisci(); renderLista(); mostra("lista");
  alert("Importate "+Object.keys(d.mod||{}).length+" modifiche, "+(d.nuove||[]).length+" ricette e "+(d.diario||[]).length+" bighe del diario.");
}

// toccare fuori da un campo chiude la tastiera: su iOS non succede da solo
document.addEventListener("touchstart", e => {
  const a = document.activeElement;
  if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA") && !e.target.closest("input,textarea,select,button,label")) a.blur();
}, {passive:true});

carica();
ricostruisci();
renderLista();

if ("serviceWorker" in navigator && sicuro){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
